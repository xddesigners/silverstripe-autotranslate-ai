name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint PHP files
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # `composer install` / `composer audit` are intentionally omitted: this module requires
      # xddesigners/silverstripe-ai, which is distributed via GitHub (not Packagist), so it cannot be
      # resolved in an isolated CI run. Dependency auditing happens in the consuming project, and in
      # xddesigners/silverstripe-ai's own CI.
